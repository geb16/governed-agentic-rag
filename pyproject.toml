[project]
name = "governed-agentic-rag"
version = "0.1.0"
description = "design and evaluating a governed enterprise stle RAG workflow."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.136,<1",
  "openai>=2.36,<3",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.12,<3",
  "qdrant-client>=1.17,<2",
  "uvicorn[standard]>=0.41,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.19,<2",
  "pytest>=9.0,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]