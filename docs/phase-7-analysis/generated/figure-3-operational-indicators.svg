<svg xmlns="http://www.w3.org/2000/svg" width="6.5in" height="2.54in" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Operational indicators</title>
<desc id="desc">Separate panels compare median latency in seconds and total token usage in tens of thousands for the baseline and governed conditions.</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="30" y="48" font-family="Aptos, Calibri, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324F">Operational indicators</text>
<text x="30" y="79" font-family="Aptos, Calibri, Arial, sans-serif" font-size="17" fill="#475569">Panels use independent scales; compare conditions within each panel</text>
<rect x="30" y="105" width="450" height="240" rx="8" fill="#F5F7FA"/>
<text x="50" y="139" font-family="Aptos, Calibri, Arial, sans-serif" font-size="19" font-weight="700" fill="#334155">Median latency (seconds)</text>
<text x="122" y="191" text-anchor="end" font-family="Aptos, Calibri, Arial, sans-serif" font-size="16" font-weight="600" fill="#334155">Baseline</text>
<rect x="140" y="166" width="181.5" height="34" rx="5" fill="#5F6B7A"/>
<text x="333.50736741035297" y="190" font-family="Aptos, Calibri, Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">6.38s</text>
<text x="122" y="268" text-anchor="end" font-family="Aptos, Calibri, Arial, sans-serif" font-size="16" font-weight="600" fill="#334155">Governed</text>
<rect x="140" y="243" width="285.0" height="34" rx="5" fill="#0072B2"/>
<text x="437.0" y="267" font-family="Aptos, Calibri, Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">10.03s</text>
<rect x="520" y="105" width="450" height="240" rx="8" fill="#F5F7FA"/>
<text x="540" y="139" font-family="Aptos, Calibri, Arial, sans-serif" font-size="19" font-weight="700" fill="#334155">Total tokens (per 10,000)</text>
<text x="612" y="191" text-anchor="end" font-family="Aptos, Calibri, Arial, sans-serif" font-size="16" font-weight="600" fill="#334155">Baseline</text>
<rect x="630" y="166" width="285.0" height="34" rx="5" fill="#5F6B7A"/>
<text x="927.0" y="190" font-family="Aptos, Calibri, Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">101.47</text>
<text x="612" y="268" text-anchor="end" font-family="Aptos, Calibri, Arial, sans-serif" font-size="16" font-weight="600" fill="#334155">Governed</text>
<rect x="630" y="243" width="223.1" height="34" rx="5" fill="#0072B2"/>
<text x="865.0942933762244" y="267" font-family="Aptos, Calibri, Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">79.43</text>
</svg>
