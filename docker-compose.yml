services:
  qdrant:
    image: qdrant/qdrant:v1.19.0-unprivileged
    restart: unless-stopped
    read_only: true
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots

volumes:
  qdrant_data:
  qdrant_snapshots:
